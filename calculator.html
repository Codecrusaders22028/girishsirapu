<!doctype html>
<html>
<head>
    <title>BASIC CALCULATOR</title>
    <style>
        
        body {
            background:white; 
            font-family: Arial;
            padding-top: 50px;
        }

       
        table {
            background-color: black;
            padding: 10px;
            border-radius: 8px;
      
        }

   
        #display {
            width: 95%;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            padding: 5px;
            background-color: #e0e0e0;
            border: 2px solid #999;
            font-family: monospace;
        }

        button {
            width: 50px;
            height: 40px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #555;
            background-color: #eee;
            border-radius: 4px;
        }

        
    </style>
</head>
<body>

    <table align="center">
        <tr>
            <td colspan="4"><input type="text" id="display" disabled></td>
        </tr>
        
        <tr> 
            <td><button onclick="appendValue('1')">1</button></td>
            <td><button onclick="appendValue('2')">2</button></td>
            <td><button onclick="appendValue('3')">3</button></td>
            <td><button onclick="appendValue('+')">+</button></td>
        </tr>
        <tr> 
            <td><button onclick="appendValue('4')">4</button></td>
            <td><button onclick="appendValue('5')">5</button></td>
            <td><button onclick="appendValue('6')">6</button></td>
            <td><button onclick="appendValue('-')">-</button></td>
        </tr>
        <tr> 
            <td><button onclick="appendValue('7')">7</button></td>
            <td><button onclick="appendValue('8')">8</button></td>
            <td><button onclick="appendValue('9')">9</button></td>
            <td><button onclick="calculate()">=</button></td>
        </tr>
        <tr> 
            <td><button onclick="appendValue('.')">.</button></td>
            <td><button onclick="appendValue('0')">0</button></td>
            <td><button onclick="appendValue('/')">/</button></td>
            <td><button onclick="appendValue('*')">*</button></td>
        </tr>
        <tr>
            <td colspan="2"><button class="btn-wide" onclick="clearDisplay()">C</button></td>
            <td colspan="2"><button class="btn-wide" onclick="deleteLast()">DEL</button></td>
        </tr>
    </table>

    <script>
        function appendValue(value) {
            document.getElementById("display").value += value;
        }

        function clearDisplay() {
            document.getElementById("display").value = "";
        }

        function deleteLast() {
            var current = document.getElementById("display").value;
            document.getElementById("display").value = current.slice(0, -1);
        }

        function calculate() {
            try {
                var input = document.getElementById("display").value;
                if(input) {
                    document.getElementById("display").value = eval(input);
                }
            } catch {
                alert("Invalid Expression");
                clearDisplay();
            }
        }
    </script>
</body>
</html>
